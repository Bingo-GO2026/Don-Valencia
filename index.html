<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Life of Don Julio &amp; Don Julia</title>

<!-- Firebase (same SDK version as the Bingo-GO game, compat build) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
  :root {
    --gold: #c9a227;
    --gold-dark: #8a6d1a;
    --cream: #fdf6e3;
    --ink: #2c2416;
    --road: #d8c9a3;
    --julio: #2d6ea6;
    --julia: #b5486b;
    --done: #2f6fb0;   /* completed node = blue, matches the Mario-map reference */
    --locked: #b9b0a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;              /* black outside, same idea as Bingo-GO */
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;            /* dvh accounts for mobile browser chrome */
  }
  /* The "playing field" — white, phone-width, centered. On an actual phone
     this fills the whole screen edge to edge; on desktop it shows as a
     white column with black bars on either side. */
  .screen {
    display: none; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    background: #f4f1e8; /* soft warm off-white — calmer than pure white */
  }
  .screen.actief { display: flex; }

  /* ── Opening curtain — sits on top of everything, splits open on tap ── */
  #gordijn {
    position: fixed; inset: 0; z-index: 200; display: flex; cursor: pointer;
  }
  #gordijn .helft {
    flex: 1; height: 100%; position: relative;
    background:
      repeating-linear-gradient(90deg, #6e0f17 0px, #8f1420 18px, #6e0f17 36px),
      linear-gradient(180deg, #7a1119, #5c0c12);
    background-blend-mode: multiply;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.6);
    transition: transform 0.9s cubic-bezier(.65,0,.35,1);
  }
  #gordijn.open .helft.links  { transform: translateX(-100%); }
  #gordijn.open .helft.rechts { transform: translateX(100%); }
  #gordijn .gordijn-tekst {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.85); font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; font-size: 0.85rem; white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6); pointer-events: none;
  }

  /* ── Main menu — pure black stage, no text, image + Start Game only ── */
  #screen-hoofdmenu {
    background: #000; align-items: center; justify-content: center;
    padding: 2rem 1.5rem; gap: 1.75rem;
  }
  .stage {
    position: relative; height: 62dvh; max-height: 620px; aspect-ratio: 9 / 16;
    max-width: 92%; display: flex; align-items: center; justify-content: center;
  }
  .stage-img {
    position: relative; z-index: 1; width: 100%; height: 100%;
    object-fit: cover; border-radius: 10px;
  }
  /* Two crossing light beams + a soft pool of light at the base — CSS-only
     stand-in for the spotlight reference image. */
  .stage-beam {
    position: absolute; top: -12%; width: 65%; height: 95%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.16), rgba(255,255,255,0) 72%);
    clip-path: polygon(38% 0%, 62% 0%, 53% 100%, 47% 100%);
    filter: blur(5px); pointer-events: none;
  }
  .stage-beam.left  { left: -20%;  transform: rotate(16deg);  transform-origin: top center; }
  .stage-beam.right { right: -20%; transform: rotate(-16deg); transform-origin: top center; }
  .stage-glow {
    position: absolute; left: 50%; bottom: 2%; width: 75%; aspect-ratio: 3 / 1;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.22), rgba(255,255,255,0) 72%);
    filter: blur(3px); pointer-events: none;
  }
  .start-knop {
    width: 100%; max-width: 320px; padding: 1.1rem; border: none; border-radius: 14px;
    background: var(--gold); color: #1a1408; font-weight: 900; font-size: 1.1rem;
    letter-spacing: 0.03em; cursor: pointer;
    box-shadow: 0 10px 36px rgba(201,162,39,0.5), 0 3px 12px rgba(0,0,0,0.4);
    transition: transform 0.12s, filter 0.15s;
  }
  .start-knop:hover  { filter: brightness(1.08); }
  .start-knop:active { transform: scale(0.97); }

  /* ── Team select screen — dark background, big neon stacked buttons,
     same formula as Bingo-GO's team-choice screen ── */
  #screen-team-select {
    background: #000;
    align-items: center; justify-content: center; padding: 2rem 1.25rem; gap: 1.5rem; text-align: center;
  }
  #screen-team-select h1 { font-size: 1.5rem; margin: 0; color: #fff; }
  #screen-team-select p.subtitel { color: rgba(255,255,255,0.55); margin: 0 0 1rem; max-width: 320px; }
  .team-knoppen { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 400px; }
  .team-knop {
    min-height: 32vh; width: 100%; padding: 1rem; border: none; border-radius: 20px;
    font-family: inherit; cursor: pointer; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
    transition: transform 0.12s, filter 0.15s;
  }
  .team-knop:hover  { transform: scale(1.02); filter: brightness(1.06); }
  .team-knop:active { transform: scale(0.97); }
  .team-knop.julio { background: var(--julio); box-shadow: 0 10px 40px rgba(45,110,166,0.55), 0 4px 16px rgba(0,0,0,0.35); }
  .team-knop.julia { background: var(--julia); box-shadow: 0 10px 40px rgba(181,72,107,0.55), 0 4px 16px rgba(0,0,0,0.35); }
  .team-knop.julio:hover { box-shadow: 0 16px 52px rgba(45,110,166,0.65), 0 6px 20px rgba(0,0,0,0.4); }
  .team-knop.julia:hover { box-shadow: 0 16px 52px rgba(181,72,107,0.65), 0 6px 20px rgba(0,0,0,0.4); }
  .team-symbool { font-size: 3rem; line-height: 1; font-weight: 900; }
  .team-naam    { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.5px; }
  .reset-link {
    margin-top: 1.25rem; background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.35); font-size: 0.75rem; text-decoration: underline;
    font-family: inherit; padding: 0.5rem;
  }
  .reset-link:hover { color: rgba(255,255,255,0.6); }

  /* ── Password popup (shared style for create + join) ── */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(30,20,10,0.55);
    align-items: center; justify-content: center; z-index: 50; padding: 1rem;
  }
  .overlay.actief { display: flex; }
  .popup {
    background: #fff; border-radius: 20px; padding: 1.5rem; max-width: 380px; width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    max-height: 85vh; max-height: 85dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .popup h3 { margin: 0 0 0.5rem; }
  .popup p { color: #6b5f45; font-size: 0.9rem; margin: 0 0 1rem; }
  .popup input[type=text], .popup input[type=password], .popup textarea {
    width: 100%; padding: 0.7rem 0.9rem; border-radius: 10px; border: 2px solid #e6dcc0;
    font-size: 1rem; margin-bottom: 0.75rem; font-family: inherit;
  }
  .knop {
    width: 100%; padding: 0.8rem; border-radius: 12px; border: none; font-weight: 800;
    font-size: 1rem; cursor: pointer; color: #fff; background: var(--gold-dark);
  }
  .knop.grijs { background: #cfc6ac; color: #4a4230; }
  .knop-rij { display: flex; gap: 0.6rem; }
  .fout-tekst { color: #b5486b; font-size: 0.85rem; margin: -0.4rem 0 0.6rem; display: none; }

  /* ── Board screen ── */
  #screen-board { padding: 1rem; gap: 1rem; }
  .board-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1rem; border-radius: 14px; color: #fff; font-weight: 800;
  }
  .board-header.julio { background: var(--julio); }
  .board-header.julia { background: var(--julia); }
  .board-header .voortgang { font-weight: 700; font-size: 0.85rem; opacity: 0.9; }
  #exit-knop { background: rgba(255,255,255,0.25); border: none; color: #fff; border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer; font-weight: 700; }

  /* Grass, just for the challenge path itself — everything else (header,
     other screens) stays on the calmer off-white/black. Two small dot
     patterns at different sizes/offsets give it a mottled texture instead
     of a flat block of color. */
  #pad-container {
    position: relative; flex: 1; min-height: 70vh;
    background-color: #6ab04c;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1.4px),
      radial-gradient(circle, rgba(0,0,0,0.10) 1px, transparent 1.4px);
    background-size: 14px 14px, 9px 9px;
    background-position: 0 0, 5px 6px;
  }
  #pad-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .node {
    position: absolute; width: 52px; height: 52px; margin-left: -26px; margin-top: -26px;
    border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 900; color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25), inset 0 -3px 0 rgba(0,0,0,0.15);
    transition: transform 0.15s ease;
  }
  .node.locked { background: var(--locked); cursor: not-allowed; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .node.actief { background: #e0483f; animation: pulse 1.4s infinite; }
  .node.voltooid { background: var(--done); }
  .node:not(.locked):active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

  /* Final node — noticeably bigger, gold ring, and a slow rotating sunburst
     behind it so it reads as "boss level" at a glance, in any status. */
  .node.finale {
    width: 78px; height: 78px; margin-left: -39px; margin-top: -39px;
    font-size: 1.7rem;
    border: 5px solid #fff;
    box-shadow: 0 0 0 4px #d9b13e, 0 6px 0 rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.15);
  }
  .node.finale.locked { background: #8a7a4f; }
  .node.finale.actief  { background: linear-gradient(160deg, #e0483f, #c9a227); animation: pulseFinale 1.3s infinite; }
  .node.finale.voltooid { background: linear-gradient(160deg, #d9b13e, var(--done)); }
  .node.finale::before {
    content: ""; position: absolute; inset: -22px; border-radius: 50%; z-index: -1;
    background: repeating-conic-gradient(rgba(217,177,62,0.55) 0deg 6deg, transparent 6deg 20deg);
    animation: rotateRays 10s linear infinite;
  }
  .finale-badge {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    background: #d9b13e; color: #1a1408; font-size: 0.62rem; font-weight: 900;
    letter-spacing: 0.08em; padding: 0.2rem 0.55rem; border-radius: 999px;
    white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  @keyframes rotateRays { to { transform: rotate(360deg); } }
  @keyframes pulseFinale {
    0%, 100% { box-shadow: 0 0 0 4px #d9b13e, 0 6px 0 rgba(0,0,0,0.3), 0 0 0 4px rgba(224,72,63,0.6); }
    50% { box-shadow: 0 0 0 4px #d9b13e, 0 6px 0 rgba(0,0,0,0.3), 0 0 0 16px rgba(224,72,63,0); }
  }

  /* Player marker — a little champagne-bottle silhouette that glides to the
     current node whenever huidigeIndex advances. */
  .speler-figuur {
    position: absolute; width: 22px; height: 46px; margin-left: -11px; margin-top: -70px;
    /* Long neck, rounded shoulder, straight body, tapered base — closer to
       an actual Champagne bottle silhouette. */
    clip-path: polygon(42% 0%, 58% 0%, 58% 20%, 80% 34%, 80% 90%, 72% 100%, 28% 100%, 20% 90%, 20% 34%, 42% 20%);
    /* One gradient, hard color-stops: gold foil neck, dark body, thin gold
       "label" band lower down — mirrors the reference bottle without needing
       separate layered elements. */
    background: linear-gradient(180deg,
      #d9b13e 0%, #d9b13e 20%,
      #161616 20%, #0c0c0c 60%,
      #c9a227 62%, #c9a227 68%,
      #0c0c0c 68%, #050505 100%);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
    transform-origin: 50% 100%;
    transform: scale(var(--figuur-schaal, 0.55));
    transition: left 3.6s cubic-bezier(.45,0,.4,1), top 3.6s cubic-bezier(.45,0,.4,1), transform 0.6s ease;
    pointer-events: none; z-index: 5;
  }
  /* A little bunny hop: three diminishing bounces with squash-and-stretch
     (stretched tall mid-air, squashed on landing), layered on top of the
     slow left/top glide so it reads as hopping across rather than sliding. */
  @keyframes spelerHop {
    0%   { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
    6%   { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.82) scaleX(1.12) translateY(0); }
    20%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(1.18) scaleX(0.9)  translateY(-22px); }
    34%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.85) scaleX(1.1)  translateY(0); }
    40%  { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
    46%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.88) scaleX(1.08) translateY(0); }
    58%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(1.12) scaleX(0.94) translateY(-14px); }
    70%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.9)  scaleX(1.06) translateY(0); }
    76%  { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
    82%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.92) scaleX(1.05) translateY(0); }
    91%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(1.07) scaleX(0.97) translateY(-7px); }
    100% { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
  }
  .speler-figuur.hopt { animation: spelerHop 3.6s ease-in-out; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 0 rgba(224,72,63,0.6); }
    50% { box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 10px rgba(224,72,63,0); }
  }

  /* ── Challenge modal ── */
  #modal-uitdaging .popup { max-width: 420px; }
  #uitdaging-icoon { font-size: 2.2rem; text-align: center; margin-bottom: 0.25rem; }
  #uitdaging-hint { font-size: 0.8rem; color: var(--gold-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; text-align: center; margin-bottom: 0.4rem; }
  #uitdaging-titel { text-align: center; }
  /* Left-aligned with real line-height once this is a full paragraph (up to
     ~150 words) — centered text gets hard to read past a sentence or two,
     and the popup itself now scrolls (see .popup) so length can't break the
     layout regardless of how long a story gets. */
  #uitdaging-tekst { text-align: left; line-height: 1.55; font-size: 0.95rem; }
  #upload-preview { width: 100%; border-radius: 12px; margin-bottom: 0.75rem; display: none; max-height: 240px; object-fit: cover; }
  #upload-status { font-size: 0.85rem; color: #6b5f45; text-align: center; margin-bottom: 0.5rem; display: none; }

  /* ── End screen ── */
  #modal-einde .popup { max-width: 460px; text-align: center; }
  #einde-galerij { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 1rem 0; }
  #einde-galerij img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>

  <!-- ═══ Opening curtain — tap to reveal the main menu underneath ═══ -->
  <div id="gordijn" onclick="openGordijn()">
    <div class="helft links"></div>
    <div class="helft rechts"></div>
    <div class="gordijn-tekst">Tap to begin</div>
  </div>

  <!-- ═══ SCREEN 1: main menu — image + Start Game, nothing else ═══ -->
  <div id="screen-hoofdmenu" class="screen actief">
    <div class="stage">
      <div class="stage-beam left"></div>
      <div class="stage-beam right"></div>
      <div class="stage-glow"></div>
      <!-- Save your artwork as hero.png in this same folder (repo root) -->
      <img src="hero.png" alt="" class="stage-img" />
    </div>
    <button class="start-knop" onclick="toonTeamkeuze()">Start Game</button>
  </div>

  <!-- ═══ SCREEN 2: pick your team ═══ -->
  <div id="screen-team-select" class="screen">
    <h1>Klaar om herboren te worden?</h1>
    <div class="team-knoppen">
      <button class="team-knop julio" onclick="kiesTeam('julio')">
        <span class="team-symbool">♂</span><span class="team-naam">Don Julio</span>
      </button>
      <button class="team-knop julia" onclick="kiesTeam('julia')">
        <span class="team-symbool">♀</span><span class="team-naam">Don Julia</span>
      </button>
    </div>
    <button class="reset-link" onclick="resetSpel()">Reset game data (testing)</button>
  </div>

  <!-- Password popup: covers both "create" (first joiner) and "join" (rest of team) -->
  <div id="overlay-wachtwoord" class="overlay">
    <div class="popup">
      <h3 id="wachtwoord-titel">Team password</h3>
      <p id="wachtwoord-uitleg">Bedenk een wachtwoord voor je team.</p>
      <input type="text" id="wachtwoord-input" maxlength="20" placeholder="e.g. DonCheadle" autocomplete="off" />
      <div class="fout-tekst" id="wachtwoord-fout">Fout wachtwoord, probeer opnieuw.</div>
      <div class="knop-rij">
        <button class="knop grijs" onclick="sluitWachtwoordPopup()">Cancel</button>
        <button class="knop" onclick="bevestigWachtwoord()">Continue</button>
      </div>
    </div>
  </div>

  <!-- ═══ SCREEN 2: the board ═══ -->
  <div id="screen-board" class="screen">
    <div class="board-header" id="board-header">
      <span id="board-header-titel">Don Julio</span>
      <span class="voortgang" id="board-voortgang">0 / 15</span>
      <button id="exit-knop" onclick="verlaatNaarStart()">Exit</button>
    </div>
    <div id="pad-container">
      <svg id="pad-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <!-- nodes get injected here by JS -->
    </div>
  </div>

  <!-- Challenge modal -->
  <div id="modal-uitdaging" class="overlay">
    <div class="popup">
      <div id="uitdaging-icoon">🍾</div>
      <div id="uitdaging-hint">Near: —</div>
      <h3 id="uitdaging-titel">Title</h3>
      <p id="uitdaging-tekst">Text</p>
      <img id="upload-preview" />
      <p id="upload-status">Uploading…</p>
      <!-- No `capture` attribute — that forces straight to the camera and
           hides the photo library option. Leaving it off lets the phone's
           native picker offer both "Take Photo" and "Choose from Library". -->
      <input type="file" id="bestand-input" accept="image/*" style="display:none" onchange="bestandGekozen(event)" />
      <div class="knop-rij">
        <button class="knop grijs" onclick="sluitUitdaging()">Close</button>
        <button class="knop" id="upload-knop" onclick="document.getElementById('bestand-input').click()"> Take / choose photo</button>
      </div>
    </div>
  </div>

  <!-- End of game -->
  <div id="modal-einde" class="overlay">
    <div class="popup">
      <h2> &amp; And they lived happily ever after...</h2>
      <p>Hier jullie leven:</p>
      <div id="einde-galerij"></div>
      <button class="knop" onclick="sluitEinde()">OK</button>
    </div>
  </div>

<script>
  // ══════════════════════════════════════════════════════════════════
  // SETUP — see SETUP.md in this repo for how to create your own values.
  // These are placeholders and will NOT work until you fill them in.
  // ══════════════════════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey:            "AIzaSyDke7nASvyFfwwnf13cnaqtu9rhOObqXM8",
    authDomain:        "don-valencia.firebaseapp.com",
    databaseURL:       "https://don-valencia-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "don-valencia",
    storageBucket:      "don-valencia.firebasestorage.app",
    messagingSenderId: "719331089999",
    appId:             "1:719331089999:web:095216ba9d30f54a59d43a",
  };
  const CLOUDINARY_CLOUD_NAME    = "wx2mgbvt";
  const CLOUDINARY_UPLOAD_PRESET = "Don Valencia";
  const FOTO_MAX_BREEDTE = 1280;   // resize photos down to this max width before upload
  const FOTO_KWALITEIT   = 0.8;    // JPEG quality (0-1)

  // One fixed event path — this whole file is built for a single trip/event,
  // not many concurrent groups. Change this string if you ever reuse the app
  // for a different trip (gives it a fresh, empty game state in Firebase).
  const EVENT_ID = "valencia2026";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.database();

  // ══════════════════════════════════════════════════════════════════
  // CHALLENGES — edit freely. Each one is a stop on the path, in order.
  // Don Julio and Don Julia are two COMPLETELY SEPARATE stories — they get
  // their own array below, and a team only ever sees its own 11 entries.
  // Nothing about one team's story is ever shown to, or shared with, the
  // other team — they're independent from start to finish.
  // `hint` = the landmark to go find. `titel`/`tekst` = the story beat and
  // what to reenact for the photo. `tekst` can safely run to a full
  // paragraph (150+ words) — the modal scrolls and wraps properly.
  // Placeholder text below is just "Challenge N X" — paste in your own
  // written story for each team, stop by stop.
  // ══════════════════════════════════════════════════════════════════
  // 11 stops total per team. The last one is rendered as a bigger "FINAL
  // LEVEL" node on the board (see renderBord) — no special field needed
  // here, it's just whichever entry ends up last in each array.
  const CHALLENGES_JULIO = [
    { icoon: "🍾", hint: "Mercado Central",                 titel: "Challenge 1",  tekst: "Wow, wat een prachtig moment. Neem even adem en sta erbij stil dat jullie zojuist nieuw leven hebben gecreëerd. <br> Na keiharde gay sex is het jullie daadwerkelijk gelukt om <br> <br> <br> een kind op aarde te brengen. En niet zomaar eentje ook: het is een baby van maar liefst 5 kilo. Maar goed dit is slechts het prille begin van het verhaal van Don Julio en zijn onvermijdelijke reis naar succes. Er zullen hoogtepunten zijn. Er zullen dieptepunten zijn. Er zullen momenten komen waarop het lot zelf hem probeert te breken. Maar als goede ouders zullen jullie aan zijn zijde staan en hem steunen tijdens iedere triomf, tragedie en totaal onverklaarbare levenskeuze. Don Julio werd geboren in de Kathedraal van Valencia. De meeste baby's huilen bij hun geboorte, maar Julio niet. Julio was anders. Vanaf moment een begon Don Julio al aura te farmen. Een baby van zijn kaliber moet dan ook een outfit hebben om zijn volle mog potentie tot aarde te brengen. Als goede vaders kleden jullie Don Julio met een anti-goon outfit aan voor zijn eerste familiefoto." },
    { icoon: "🎈", hint: "Jardín del Turia",                titel: "Challenge 2",  tekst: "Challenge 2 X" },
    { icoon: "💘", hint: "Plaza de la Virgen",               titel: "Challenge 3",  tekst: "Challenge 3 X" },
    { icoon: "🎸", hint: "Barri del Carmen",                 titel: "Challenge 4",  tekst: "Challenge 4 X" },
    { icoon: "💼", hint: "Mercado de Colón",                 titel: "Challenge 5",  tekst: "Challenge 5 X" },
    { icoon: "🌟", hint: "Ciutat de les Arts i les Ciències", titel: "Challenge 6",  tekst: "Challenge 6 X" },
    { icoon: "🐠", hint: "Oceanogràfic",                     titel: "Challenge 7",  tekst: "Challenge 7 X" },
    { icoon: "🦁", hint: "Bioparc València",                 titel: "Challenge 8",  tekst: "Challenge 8 X" },
    { icoon: "🎉", hint: "Carmen nightlife",                 titel: "Challenge 9",  tekst: "Challenge 9 X" },
    { icoon: "🏛️", hint: "Plaza del Ayuntamiento",           titel: "Challenge 10", tekst: "Challenge 10 X" },
    { icoon: "🥂", hint: "Tonight's final spot",             titel: "Challenge 11", tekst: "Challenge 11 X" },
  ];

  const CHALLENGES_JULIA = [
    { icoon: "", hint: "Mercado Central",                 titel: "Challenge 1",  tekst: "Challenge 1 X" },
    { icoon: "", hint: "Jardín del Turia",                titel: "Challenge 2",  tekst: "Challenge 2 X" },
    { icoon: "", hint: "Plaza de la Virgen",               titel: "Challenge 3",  tekst: "Challenge 3 X" },
    { icoon: "", hint: "Barri del Carmen",                 titel: "Challenge 4",  tekst: "Challenge 4 X" },
    { icoon: "", hint: "Mercado de Colón",                 titel: "Challenge 5",  tekst: "Challenge 5 X" },
    { icoon: "", hint: "Ciutat de les Arts i les Ciències", titel: "Challenge 6",  tekst: "Challenge 6 X" },
    { icoon: "", hint: "Oceanogràfic",                     titel: "Challenge 7",  tekst: "Challenge 7 X" },
    { icoon: "", hint: "Bioparc València",                 titel: "Challenge 8",  tekst: "Challenge 8 X" },
    { icoon: "", hint: "Carmen nightlife",                 titel: "Challenge 9",  tekst: "Challenge 9 X" },
    { icoon: "", hint: "Plaza del Ayuntamiento",           titel: "Challenge 10", tekst: "Challenge 10 X" },
    { icoon: "", hint: "Tonight's final spot",             titel: "Challenge 11", tekst: "Challenge 11 X" },
  ];

  // Always look up the active team's own story through this — never reach
  // for CHALLENGES_JULIO / CHALLENGES_JULIA directly outside this function,
  // so the two stories can never accidentally cross.
  function huidigeUitdagingen() {
    return huidigTeam === 'julia' ? CHALLENGES_JULIA : CHALLENGES_JULIO;
  }

  // ══════════════════════════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════════════════════════
  let huidigTeam = null;      // 'julio' | 'julia'
  let huidigeIndex = 0;       // index of the currently unlocked/active challenge
  let voltooid = {};          // { index: { fotoUrl, ts } } — completed challenges
  let authKlaar = false;
  let gekozenBestand = null;

  auth.signInAnonymously().catch(function(err) { console.error('Auth failed:', err); });
  auth.onAuthStateChanged(function(user) {
    authKlaar = !!user;
    const opgeslagenTeam = localStorage.getItem('donjulio_team');
    const opgeslagenPw   = localStorage.getItem('donjulio_pw');
    if (authKlaar && opgeslagenTeam && opgeslagenPw) {
      herstelSessie(opgeslagenTeam, opgeslagenPw);
    }
  });

  function teamRef(team) { return db.ref('spellen/' + EVENT_ID + '/teams/' + team); }

  // ── Team pick + password gate ──
  let _wachtwoordVoorTeam = null;

  function kiesTeam(team) {
    _wachtwoordVoorTeam = team;
    teamRef(team).child('wachtwoord').get().then(function(snap) {
      const bestaandWachtwoord = snap.val();
      const titel = document.getElementById('wachtwoord-titel');
      const uitleg = document.getElementById('wachtwoord-uitleg');
      document.getElementById('wachtwoord-input').value = '';
      document.getElementById('wachtwoord-fout').style.display = 'none';
      if (bestaandWachtwoord) {
        titel.textContent = 'Enter the team password';
        uitleg.textContent = 'Someone on your team already started — ask them for the password.';
      } else {
        titel.textContent = 'Set a team password';
        uitleg.textContent = "You're first! Pick a password and share it with your teammates.";
      }
      document.getElementById('overlay-wachtwoord').classList.add('actief');
    });
  }

  function sluitWachtwoordPopup() {
    document.getElementById('overlay-wachtwoord').classList.remove('actief');
    _wachtwoordVoorTeam = null;
  }

  async function bevestigWachtwoord() {
    const ingevoerd = document.getElementById('wachtwoord-input').value.trim();
    if (!ingevoerd) return;
    const team = _wachtwoordVoorTeam;
    const snap = await teamRef(team).child('wachtwoord').get();
    const bestaand = snap.val();
    if (bestaand) {
      if (ingevoerd !== bestaand) {
        document.getElementById('wachtwoord-fout').style.display = 'block';
        return;
      }
    } else {
      await teamRef(team).child('wachtwoord').set(ingevoerd);
    }
    localStorage.setItem('donjulio_team', team);
    localStorage.setItem('donjulio_pw', ingevoerd);
    document.getElementById('overlay-wachtwoord').classList.remove('actief');
    startTeam(team);
  }

  function herstelSessie(team, wachtwoord) {
    teamRef(team).child('wachtwoord').get().then(function(snap) {
      if (snap.val() === wachtwoord) startTeam(team);
    });
  }

  function openGordijn() {
    const g = document.getElementById('gordijn');
    g.classList.add('open');
    // Let the slide-apart transition finish, then take it fully out of the
    // way so it can't intercept taps on the main menu underneath.
    setTimeout(function() { g.style.display = 'none'; }, 950);
  }

  // Testing helper — wipes both teams' progress and passwords for this
  // EVENT_ID entirely, and clears the saved local session so you don't
  // keep auto-rejoining a half-finished test run. Remove or hide this
  // button before the real event if you don't want guests able to see it.
  async function resetSpel() {
    const bevestigd = confirm('Reset ALL progress for both teams? This cannot be undone.');
    if (!bevestigd) return;
    await db.ref('spellen/' + EVENT_ID).remove();
    localStorage.removeItem('donjulio_team');
    localStorage.removeItem('donjulio_pw');
    alert('Game reset — both teams will start fresh.');
  }

  function toonTeamkeuze() {
    document.getElementById('screen-hoofdmenu').classList.remove('actief');
    document.getElementById('screen-team-select').classList.add('actief');
  }

  function startTeam(team) {
    huidigTeam = team;
    // Covers both the normal path (from team-select) and auto-rejoin on
    // page load (which can jump here straight from the main menu).
    document.getElementById('screen-hoofdmenu').classList.remove('actief');
    document.getElementById('screen-team-select').classList.remove('actief');
    document.getElementById('screen-board').classList.add('actief');
    const header = document.getElementById('board-header');
    header.className = 'board-header ' + team;
    document.getElementById('board-header-titel').textContent = team === 'julio' ? 'Don Julio' : 'Don Julia';
    bindListener();
  }

  // Exit takes you all the way back to the main menu, not just team-select —
  // a clean reset for whoever picks up the phone next.
  function verlaatNaarStart() {
    if (teamListenerRef) { teamListenerRef.off(); teamListenerRef = null; }
    huidigTeam = null;
    document.getElementById('screen-board').classList.remove('actief');
    document.getElementById('screen-team-select').classList.remove('actief');
    document.getElementById('screen-hoofdmenu').classList.add('actief');
  }

  // ── Live sync of team progress ──
  let teamListenerRef = null;
  function bindListener() {
    teamListenerRef = teamRef(huidigTeam);
    teamListenerRef.on('value', function(snap) {
      const data = snap.val() || {};
      huidigeIndex = data.huidigeIndex || 0;
      voltooid = data.voltooid || {};
      renderBord();
      if (huidigeIndex >= huidigeUitdagingen().length) toonEinde();
    });
  }

  // ── Board rendering: Mario-overworld style snake path ──
  function knoopPositie(i, totaal) {
    const rijen = Math.ceil(totaal / 3);
    const rij = Math.floor(i / 3);
    const posInRij = i % 3;
    const rijEvenRichting = rij % 2 === 0; // even rows: left-to-right, odd: right-to-left
    const col = rijEvenRichting ? posInRij : (2 - posInRij);
    const x = 20 + col * 30;                              // 20 / 50 / 80
    const y = rijen <= 1 ? 50 : 10 + (rij / (rijen - 1)) * 80; // spread 10–90
    return { x: x, y: y };
  }

  function renderBord() {
    const container = document.getElementById('pad-container');
    const svg = document.getElementById('pad-svg');
    document.getElementById('board-voortgang').textContent = Math.min(huidigeIndex, huidigeUitdagingen().length) + ' / ' + huidigeUitdagingen().length;

    // Remove old node elements (keep the svg)
    container.querySelectorAll('.node').forEach(function(el) { el.remove(); });

    const punten = huidigeUitdagingen().map(function(c, i) { return knoopPositie(i, huidigeUitdagingen().length); });

    // Draw the path in real pixel space (not a 0-100 viewBox stretched to fit)
    // so the stroke stays a true circle/round cap instead of getting warped
    // by the container's aspect ratio. Node <div>s still use % positioning,
    // which is unaffected by aspect ratio, so the two line up correctly.
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    const lijnPunten = punten.map(function(p) { return (p.x / 100 * w) + ',' + (p.y / 100 * h); }).join(' ');
    // Retro-path look: a dark "border" stroke underneath, a lighter "surface"
    // stroke on top — same trick as the dirt/stone path tiles in the
    // reference image (dark edge, lighter worn center), just via two strokes
    // instead of a texture image.
    svg.innerHTML =
      '<polyline points="' + lijnPunten + '" fill="none" stroke="#a9895a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />' +
      '<polyline points="' + lijnPunten + '" fill="none" stroke="#e4c98f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />';

    punten.forEach(function(p, i) {
      const el = document.createElement('div');
      let status = 'locked';
      if (voltooid[i]) status = 'voltooid';
      else if (i === huidigeIndex) status = 'actief';
      const isFinale = i === huidigeUitdagingen().length - 1;
      el.className = 'node ' + status + (isFinale ? ' finale' : '');
      el.style.left = p.x + '%';
      el.style.top  = p.y + '%';
      // Deliberately no title/label here — nothing about a challenge is
      // revealed until you actually tap into it. The finale badge just
      // marks "this is the last one", not what it actually is.
      el.textContent = status === 'voltooid' ? '✓' : String(i + 1);
      if (isFinale) {
        const badge = document.createElement('span');
        badge.className = 'finale-badge';
        badge.textContent = 'FINAL';
        el.appendChild(badge);
      }
      if (status === 'actief') el.addEventListener('click', function() { openUitdaging(i); });
      if (status === 'voltooid') el.addEventListener('click', function() { bekijkVoltooid(i); });
      container.appendChild(el);
    });

    updateSpelerFiguur(container, punten);
  }

  // Little champagne-bottle marker that hops to whichever node is currently
  // active — parked there when idle, and slowly hops over to the new one the
  // moment huidigeIndex advances. Also grows from a "baby" bottle toward
  // full size as more of the story gets completed.
  let vorigeSpelerIndex = null;
  function updateSpelerFiguur(container, punten) {
    let fig = document.getElementById('speler-figuur');
    if (!fig) {
      fig = document.createElement('div');
      fig.id = 'speler-figuur';
      fig.className = 'speler-figuur';
      // Appended once and never moved again — re-appending on every render
      // (to "stay on top") was the bug that made it snap instead of glide:
      // reinserting an element into the DOM resets its transition baseline.
      // z-index already puts it above the nodes, so this isn't needed anyway.
      container.appendChild(fig);
    }

    const doelIndex = Math.min(huidigeIndex, huidigeUitdagingen().length - 1);
    const doel = punten[doelIndex];

    const voltooidAantal = Object.keys(voltooid).length;
    const groei = 0.55 + Math.min(1, voltooidAantal / huidigeUitdagingen().length) * 0.65; // 0.55 → 1.2
    fig.style.setProperty('--figuur-schaal', groei.toFixed(2));

    if (doelIndex !== vorigeSpelerIndex) {
      // Restart the hop cleanly even if triggered again quickly.
      fig.classList.remove('hopt');
      void fig.offsetWidth; // force reflow so the class removal actually "sticks" before re-adding
      fig.classList.add('hopt');
      vorigeSpelerIndex = doelIndex;
    }
    fig.style.left = doel.x + '%';
    fig.style.top  = doel.y + '%';
  }

  // Re-draw on resize/orientation change so the path stays pixel-accurate
  // (only matters while the board is actually visible).
  window.addEventListener('resize', function() {
    if (huidigTeam) renderBord();
  });

  // ── Challenge modal ──
  let huidigeUitdagingIndex = null;

  function openUitdaging(i) {
    huidigeUitdagingIndex = i;
    const c = huidigeUitdagingen()[i];
    document.getElementById('uitdaging-icoon').textContent = c.icoon;
    document.getElementById('uitdaging-hint').textContent = 'Near: ' + c.hint;
    document.getElementById('uitdaging-titel').textContent = c.titel;
    document.getElementById('uitdaging-tekst').textContent = c.tekst;
    document.getElementById('upload-preview').style.display = 'none';
    document.getElementById('upload-status').style.display = 'none';
    document.getElementById('upload-knop').disabled = false;
    document.getElementById('upload-knop').textContent = '📷 Take / choose photo';
    document.getElementById('modal-uitdaging').classList.add('actief');
  }

  function bekijkVoltooid(i) {
    const c = huidigeUitdagingen()[i];
    const v = voltooid[i];
    huidigeUitdagingIndex = null; // read-only view, no re-upload
    document.getElementById('uitdaging-icoon').textContent = c.icoon;
    document.getElementById('uitdaging-hint').textContent = 'Near: ' + c.hint;
    document.getElementById('uitdaging-titel').textContent = c.titel + ' ✓';
    document.getElementById('uitdaging-tekst').textContent = c.tekst;
    const preview = document.getElementById('upload-preview');
    if (v && v.fotoUrl) { preview.src = v.fotoUrl; preview.style.display = 'block'; }
    document.getElementById('upload-status').style.display = 'none';
    document.getElementById('upload-knop').disabled = true;
    document.getElementById('upload-knop').textContent = 'Already completed';
    document.getElementById('modal-uitdaging').classList.add('actief');
  }

  function sluitUitdaging() {
    document.getElementById('modal-uitdaging').classList.remove('actief');
    huidigeUitdagingIndex = null;
  }

  // Resize + JPEG-compress before upload — keeps uploads fast on mobile data
  // and caps how large a file can reach the Cloudinary API, on top of
  // whatever allowed_formats/max_file_size you've set on the preset itself.
  function comprimeerFoto(bestand) {
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let w = img.width, h = img.height;
          if (w > FOTO_MAX_BREEDTE) { h = Math.round(h * FOTO_MAX_BREEDTE / w); w = FOTO_MAX_BREEDTE; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL('image/jpeg', FOTO_KWALITEIT)); }
          catch (err) { reject(err); }
        };
        img.onerror = function() { reject(new Error('invalid image')); };
        img.src = e.target.result;
      };
      reader.onerror = function() { reject(new Error('failed to read file')); };
      reader.readAsDataURL(bestand);
    });
  }

  async function bestandGekozen(event) {
    const bestand = event.target.files[0];
    event.target.value = '';
    if (!bestand || huidigeUitdagingIndex === null) return;

    const preview = document.getElementById('upload-preview');
    const status  = document.getElementById('upload-status');
    const knop    = document.getElementById('upload-knop');
    preview.src = URL.createObjectURL(bestand);
    preview.style.display = 'block';
    status.style.display = 'block';
    status.textContent = 'Compressing…';
    knop.disabled = true;

    try {
      const gecomprimeerd = await comprimeerFoto(bestand);
      status.textContent = 'Uploading…';
      const fotoUrl = await uploadNaarCloudinary(gecomprimeerd);
      status.textContent = 'Uploaded! Unlocking the next stop…';
      const i = huidigeUitdagingIndex;
      // Only advance if this is still the currently-active square (avoids two
      // teammates both uploading at once and double-advancing the index).
      await teamRef(huidigTeam).transaction(function(data) {
        data = data || {};
        if ((data.huidigeIndex || 0) !== i) return data; // someone beat you to it
        data.voltooid = data.voltooid || {};
        data.voltooid[i] = { fotoUrl: fotoUrl, ts: Date.now() };
        data.huidigeIndex = i + 1;
        return data;
      });
      setTimeout(sluitUitdaging, 700);
    } catch (err) {
      console.error(err);
      status.textContent = 'Upload failed — try again.';
      knop.disabled = false;
    }
  }

  function uploadNaarCloudinary(bestand) {
    return new Promise(function(resolve, reject) {
      const form = new FormData();
      form.append('file', bestand);
      form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', {
        method: 'POST', body: form,
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.secure_url) resolve(data.secure_url);
          else reject(new Error(data.error ? data.error.message : 'Upload failed'));
        })
        .catch(reject);
    });
  }

  // ── End of game ──
  let eindeGetoond = false;
  function toonEinde() {
    if (eindeGetoond) return;
    eindeGetoond = true;
    const galerij = document.getElementById('einde-galerij');
    galerij.innerHTML = '';
    huidigeUitdagingen().forEach(function(c, i) {
      if (voltooid[i] && voltooid[i].fotoUrl) {
        const img = document.createElement('img');
        img.src = voltooid[i].fotoUrl;
        galerij.appendChild(img);
      }
    });
    document.getElementById('modal-einde').classList.add('actief');
  }

  function sluitEinde() {
    document.getElementById('modal-einde').classList.remove('actief');
    eindeGetoond = false;
    verlaatNaarStart();
  }
</script>
