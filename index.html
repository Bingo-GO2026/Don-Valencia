<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Life of Don Julio &amp; Don Julia</title>

<!-- Firebase (same SDK version as the Bingo-GO game, compat build) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
 
<style>
  :root {
    --gold: #c9a227;
    --gold-dark: #8a6d1a;
    --cream: #fdf6e3;
    --ink: #2c2416;
    --road: #d8c9a3;
    --julio: #2d6ea6;
    --julia: #b5486b;
    --done: #2f6fb0;   /* completed node = blue, matches the Mario-map reference */
    --locked: #b9b0a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;              /* black outside, same idea as Bingo-GO */
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;            /* dvh accounts for mobile browser chrome */
  }
  /* The "playing field" — white, phone-width, centered. On an actual phone
     this fills the whole screen edge to edge; on desktop it shows as a
     white column with black bars on either side. */
  .screen {
    display: none; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    background: #f4f1e8; /* soft warm off-white — calmer than pure white */
  }
  .screen.actief { display: flex; }

  /* ── Opening curtain — sits on top of everything, splits open on tap ── */
  #gordijn {
    position: fixed; inset: 0; z-index: 200; display: flex; cursor: pointer;
  }
  #gordijn .helft {
    flex: 1; height: 100%; position: relative;
    background:
      repeating-linear-gradient(90deg, #6e0f17 0px, #8f1420 18px, #6e0f17 36px),
      linear-gradient(180deg, #7a1119, #5c0c12);
    background-blend-mode: multiply;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.6);
    transition: transform 0.9s cubic-bezier(.65,0,.35,1);
  }
  #gordijn.open .helft.links  { transform: translateX(-100%); }
  #gordijn.open .helft.rechts { transform: translateX(100%); }
  #gordijn .gordijn-tekst {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.85); font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; font-size: 0.85rem; white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6); pointer-events: none;
  }

  /* ── Main menu — pure black stage, no text, image + Start Game only ── */
  #screen-hoofdmenu {
    background: #000; align-items: center; justify-content: center;
    padding: 2rem 1.5rem; gap: 1.75rem;
  }
  .stage {
    position: relative; height: 62dvh; max-height: 620px; aspect-ratio: 9 / 16;
    max-width: 92%; display: flex; align-items: center; justify-content: center;
  }
  .stage-img {
    position: relative; z-index: 1; width: 100%; height: 100%;
    object-fit: cover; border-radius: 10px;
  }
  /* Two crossing light beams + a soft pool of light at the base — CSS-only
     stand-in for the spotlight reference image. */
  .stage-beam {
    position: absolute; top: -12%; width: 65%; height: 95%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.16), rgba(255,255,255,0) 72%);
    clip-path: polygon(38% 0%, 62% 0%, 53% 100%, 47% 100%);
    filter: blur(5px); pointer-events: none;
  }
  .stage-beam.left  { left: -20%;  transform: rotate(16deg);  transform-origin: top center; }
  .stage-beam.right { right: -20%; transform: rotate(-16deg); transform-origin: top center; }
  .stage-glow {
    position: absolute; left: 50%; bottom: 2%; width: 75%; aspect-ratio: 3 / 1;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.22), rgba(255,255,255,0) 72%);
    filter: blur(3px); pointer-events: none;
  }
  .start-knop {
    width: 100%; max-width: 320px; padding: 1.1rem; border: none; border-radius: 14px;
    background: var(--gold); color: #1a1408; font-weight: 900; font-size: 1.1rem;
    letter-spacing: 0.03em; cursor: pointer;
    box-shadow: 0 10px 36px rgba(201,162,39,0.5), 0 3px 12px rgba(0,0,0,0.4);
    transition: transform 0.12s, filter 0.15s;
  }
  .start-knop:hover  { filter: brightness(1.08); }
  .start-knop:active { transform: scale(0.97); }

  /* ── Team select screen — dark background, big neon stacked buttons,
     same formula as Bingo-GO's team-choice screen ── */
  #screen-team-select {
    background: #000;
    align-items: center; justify-content: center; padding: 2rem 1.25rem; gap: 1.5rem; text-align: center;
  }
  #screen-team-select h1 { font-size: 1.5rem; margin: 0; color: #fff; }
  #screen-team-select p.subtitel { color: rgba(255,255,255,0.55); margin: 0 0 1rem; max-width: 320px; }
  .team-knoppen { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 400px; }
  .team-knop {
    min-height: 32vh; width: 100%; padding: 1rem; border: none; border-radius: 20px;
    font-family: inherit; cursor: pointer; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
    transition: transform 0.12s, filter 0.15s;
  }
  .team-knop:hover  { transform: scale(1.02); filter: brightness(1.06); }
  .team-knop:active { transform: scale(0.97); }
  .team-knop.julio { background: var(--julio); box-shadow: 0 10px 40px rgba(45,110,166,0.55), 0 4px 16px rgba(0,0,0,0.35); }
  .team-knop.julia { background: var(--julia); box-shadow: 0 10px 40px rgba(181,72,107,0.55), 0 4px 16px rgba(0,0,0,0.35); }
  .team-knop.julio:hover { box-shadow: 0 16px 52px rgba(45,110,166,0.65), 0 6px 20px rgba(0,0,0,0.4); }
  .team-knop.julia:hover { box-shadow: 0 16px 52px rgba(181,72,107,0.65), 0 6px 20px rgba(0,0,0,0.4); }
  .team-symbool { font-size: 3rem; line-height: 1; font-weight: 900; }
  .team-naam    { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.5px; }
  .reset-link {
    margin-top: 1.25rem; background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.35); font-size: 0.75rem; text-decoration: underline;
    font-family: inherit; padding: 0.5rem;
  }
  .reset-link:hover { color: rgba(255,255,255,0.6); }

  /* ── Password popup (shared style for create + join) ── */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(30,20,10,0.55);
    align-items: center; justify-content: center; z-index: 50; padding: 1rem;
  }
  .overlay.actief { display: flex; }
  .popup {
    background: #fff; border-radius: 20px; padding: 1.5rem; max-width: 380px; width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    max-height: 85vh; max-height: 85dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .popup h3 { margin: 0 0 0.5rem; }
  .popup p { color: #6b5f45; font-size: 0.9rem; margin: 0 0 1rem; }
  .popup input[type=text], .popup input[type=password], .popup textarea {
    width: 100%; padding: 0.7rem 0.9rem; border-radius: 10px; border: 2px solid #e6dcc0;
    font-size: 1rem; margin-bottom: 0.75rem; font-family: inherit;
  }
  .knop {
    width: 100%; padding: 0.8rem; border-radius: 12px; border: none; font-weight: 800;
    font-size: 1rem; cursor: pointer; color: #fff; background: var(--gold-dark);
  }
  .knop.grijs { background: #cfc6ac; color: #4a4230; }
  .knop-rij { display: flex; gap: 0.6rem; }
  .fout-tekst { color: #b5486b; font-size: 0.85rem; margin: -0.4rem 0 0.6rem; display: none; }

  /* ── Board screen ── */
  #screen-board { padding: 1rem; gap: 1rem; }
  .board-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1rem; border-radius: 14px; color: #fff; font-weight: 800;
  }
  .board-header.julio { background: var(--julio); }
  .board-header.julia { background: var(--julia); }
  .board-header .voortgang { font-weight: 700; font-size: 0.85rem; opacity: 0.9; }
  #exit-knop { background: rgba(255,255,255,0.25); border: none; color: #fff; border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer; font-weight: 700; }

  /* Grass, just for the challenge path itself — everything else (header,
     other screens) stays on the calmer off-white/black. Two small dot
     patterns at different sizes/offsets give it a mottled texture instead
     of a flat block of color. */
  #pad-container {
    position: relative; flex: 1; min-height: 70vh;
    background-color: #6ab04c;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1.4px),
      radial-gradient(circle, rgba(0,0,0,0.10) 1px, transparent 1.4px);
    background-size: 14px 14px, 9px 9px;
    background-position: 0 0, 5px 6px;
  }
  #pad-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .node {
    position: absolute; width: 52px; height: 52px; margin-left: -26px; margin-top: -26px;
    border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 900; color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25), inset 0 -3px 0 rgba(0,0,0,0.15);
    transition: transform 0.15s ease;
  }
  .node.locked { background: var(--locked); cursor: not-allowed; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .node.actief { background: #e0483f; animation: pulse 1.4s infinite; }
  .node.voltooid { background: var(--done); }
  .node:not(.locked):active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

  /* Final node — noticeably bigger, gold ring, and a slow rotating sunburst
     behind it so it reads as "boss level" at a glance, in any status. */
  .node.finale {
    width: 78px; height: 78px; margin-left: -39px; margin-top: -39px;
    font-size: 1.7rem;
    border: 5px solid #fff;
    box-shadow: 0 0 0 4px #d9b13e, 0 6px 0 rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.15);
  }
  .node.finale.locked { background: #8a7a4f; }
  .node.finale.actief  { background: linear-gradient(160deg, #e0483f, #c9a227); animation: pulseFinale 1.3s infinite; }
  .node.finale.voltooid { background: linear-gradient(160deg, #d9b13e, var(--done)); }
  .node.finale::before {
    content: ""; position: absolute; inset: -22px; border-radius: 50%; z-index: -1;
    background: repeating-conic-gradient(rgba(217,177,62,0.55) 0deg 6deg, transparent 6deg 20deg);
    animation: rotateRays 10s linear infinite;
  }
  .finale-badge {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    background: #d9b13e; color: #1a1408; font-size: 0.62rem; font-weight: 900;
    letter-spacing: 0.08em; padding: 0.2rem 0.55rem; border-radius: 999px;
    white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  @keyframes rotateRays { to { transform: rotate(360deg); } }
  @keyframes pulseFinale {
    0%, 100% { box-shadow: 0 0 0 4px #d9b13e, 0 6px 0 rgba(0,0,0,0.3), 0 0 0 4px rgba(224,72,63,0.6); }
    50% { box-shadow: 0 0 0 4px #d9b13e, 0 6px 0 rgba(0,0,0,0.3), 0 0 0 16px rgba(224,72,63,0); }
  }

  /* Player marker — a little champagne-bottle silhouette that glides to the
     current node whenever huidigeIndex advances. */
  .speler-figuur {
    position: absolute; width: 22px; height: 46px; margin-left: -11px; margin-top: -70px;
    /* Long neck, rounded shoulder, straight body, tapered base — closer to
       an actual Champagne bottle silhouette. */
    clip-path: polygon(42% 0%, 58% 0%, 58% 20%, 80% 34%, 80% 90%, 72% 100%, 28% 100%, 20% 90%, 20% 34%, 42% 20%);
    /* One gradient, hard color-stops: gold foil neck, dark body, thin gold
       "label" band lower down — mirrors the reference bottle without needing
       separate layered elements. */
    background: linear-gradient(180deg,
      #d9b13e 0%, #d9b13e 20%,
      #161616 20%, #0c0c0c 60%,
      #c9a227 62%, #c9a227 68%,
      #0c0c0c 68%, #050505 100%);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
    transform-origin: 50% 100%;
    transform: scale(var(--figuur-schaal, 0.55));
    transition: left 3.6s cubic-bezier(.45,0,.4,1), top 3.6s cubic-bezier(.45,0,.4,1), transform 0.6s ease;
    pointer-events: none; z-index: 5;
  }
  /* A little bunny hop: three diminishing bounces with squash-and-stretch
     (stretched tall mid-air, squashed on landing), layered on top of the
     slow left/top glide so it reads as hopping across rather than sliding. */
  @keyframes spelerHop {
    0%   { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
    6%   { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.82) scaleX(1.12) translateY(0); }
    20%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(1.18) scaleX(0.9)  translateY(-22px); }
    34%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.85) scaleX(1.1)  translateY(0); }
    40%  { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
    46%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.88) scaleX(1.08) translateY(0); }
    58%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(1.12) scaleX(0.94) translateY(-14px); }
    70%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.9)  scaleX(1.06) translateY(0); }
    76%  { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
    82%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(0.92) scaleX(1.05) translateY(0); }
    91%  { transform: scale(var(--figuur-schaal, 0.55)) scaleY(1.07) scaleX(0.97) translateY(-7px); }
    100% { transform: scale(var(--figuur-schaal, 0.55)) translateY(0); }
  }
  .speler-figuur.hopt { animation: spelerHop 3.6s ease-in-out; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 0 rgba(224,72,63,0.6); }
    50% { box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 10px rgba(224,72,63,0); }
  }

  /* ── Challenge modal ── */
  #modal-uitdaging .popup { max-width: 420px; }
  #uitdaging-icoon { font-size: 2.2rem; text-align: center; margin-bottom: 0.25rem; }
  #uitdaging-hint { font-size: 0.8rem; color: var(--gold-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; text-align: center; margin-bottom: 0.4rem; }
  #uitdaging-titel { text-align: center; }
  /* Left-aligned with real line-height once this is a full paragraph (up to
     ~150 words) — centered text gets hard to read past a sentence or two,
     and the popup itself now scrolls (see .popup) so length can't break the
     layout regardless of how long a story gets. */
  /* white-space: pre-line makes \n in the `tekst` string render as a real
     line break (and a blank line as a paragraph break), while still
     collapsing extra spaces and auto-wrapping long lines like normal text. */
  #uitdaging-tekst { text-align: left; line-height: 1.55; font-size: 0.95rem; white-space: pre-line; }
  #upload-preview { width: 100%; border-radius: 12px; margin-bottom: 0.75rem; display: none; max-height: 240px; object-fit: cover; }
  #upload-status { font-size: 0.85rem; color: #6b5f45; text-align: center; margin-bottom: 0.5rem; display: none; }

  /* ── End screen ── */
  #modal-einde .popup { max-width: 460px; text-align: center; }
  #einde-galerij { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 1rem 0; }
  #einde-galerij img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>

  <!-- ═══ Opening curtain — tap to reveal the main menu underneath ═══ -->
  <div id="gordijn" onclick="openGordijn()">
    <div class="helft links"></div>
    <div class="helft rechts"></div>
    <div class="gordijn-tekst">Tap to begin</div>
  </div>

  <!-- ═══ SCREEN 1: main menu — image + Start Game, nothing else ═══ -->
  <div id="screen-hoofdmenu" class="screen actief">
    <div class="stage">
      <div class="stage-beam left"></div>
      <div class="stage-beam right"></div>
      <div class="stage-glow"></div>
      <!-- Save your artwork as hero.png in this same folder (repo root) -->
      <img src="hero.png" alt="" class="stage-img" />
    </div>
    <button class="start-knop" onclick="toonTeamkeuze()">Start Game</button>
  </div>

  <!-- ═══ SCREEN 2: pick your team ═══ -->
  <div id="screen-team-select" class="screen">
    <h1>Klaar om herboren te worden?</h1>
    <div class="team-knoppen">
      <button class="team-knop julio" onclick="kiesTeam('julio')">
        <span class="team-symbool">♂</span><span class="team-naam">Don Julio</span>
      </button>
      <button class="team-knop julia" onclick="kiesTeam('julia')">
        <span class="team-symbool">♀</span><span class="team-naam">Don Julia</span>
      </button>
    </div>
    <button class="reset-link" onclick="resetSpel()">Reset game data (testing)</button>
  </div>

  <!-- Password popup: covers both "create" (first joiner) and "join" (rest of team) -->
  <div id="overlay-wachtwoord" class="overlay">
    <div class="popup">
      <h3 id="wachtwoord-titel">Team password</h3>
      <p id="wachtwoord-uitleg">Be the first? Set a password for your team and share it with everyone joining.</p>
      <input type="text" id="wachtwoord-input" maxlength="20" placeholder="e.g. donjulio2026" autocomplete="off" />
      <div class="fout-tekst" id="wachtwoord-fout">Wrong password — try again.</div>
      <div class="knop-rij">
        <button class="knop grijs" onclick="sluitWachtwoordPopup()">Cancel</button>
        <button class="knop" onclick="bevestigWachtwoord()">Continue</button>
      </div>
    </div>
  </div>

  <!-- ═══ SCREEN 2: the board ═══ -->
  <div id="screen-board" class="screen">
    <div class="board-header" id="board-header">
      <span id="board-header-titel">Don Julio</span>
      <span class="voortgang" id="board-voortgang">0 / 15</span>
      <button id="exit-knop" onclick="verlaatNaarStart()">Exit</button>
    </div>
    <div id="pad-container">
      <svg id="pad-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <!-- nodes get injected here by JS -->
    </div>
  </div>

  <!-- Challenge modal -->
  <div id="modal-uitdaging" class="overlay">
    <div class="popup">
      <div id="uitdaging-icoon">🍾</div>
      <div id="uitdaging-hint">Near: —</div>
      <h3 id="uitdaging-titel">Title</h3>
      <p id="uitdaging-tekst">Text</p>
      <img id="upload-preview" />
      <p id="upload-status">Uploading…</p>
      <!-- No `capture` attribute — that forces straight to the camera and
           hides the photo library option. Leaving it off lets the phone's
           native picker offer both "Take Photo" and "Choose from Library". -->
      <input type="file" id="bestand-input" accept="image/*" style="display:none" onchange="bestandGekozen(event)" />
      <div class="knop-rij">
        <button class="knop grijs" onclick="sluitUitdaging()">Close</button>
        <button class="knop" id="upload-knop" onclick="document.getElementById('bestand-input').click()"> Take / choose photo</button>
      </div>
    </div>
  </div>

  <!-- End of game -->
  <div id="modal-einde" class="overlay">
    <div class="popup">
      <h2> And they lived happily ever after</h2>
      <p>Thanks for playing — here's your journey:</p>
      <div id="einde-galerij"></div>
      <button class="knop" onclick="sluitEinde()">OK</button>
    </div>
  </div>

<script>
  // ══════════════════════════════════════════════════════════════════
  // SETUP — see SETUP.md in this repo for how to create your own values.
  // These are placeholders and will NOT work until you fill them in.
  // ══════════════════════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey:            "AIzaSyDke7nASvyFfwwnf13cnaqtu9rhOObqXM8",
    authDomain:        "don-valencia.firebaseapp.com",
    databaseURL:       "https://don-valencia-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "don-valencia",
    storageBucket:      "don-valencia.firebasestorage.app",
    messagingSenderId: "719331089999",
    appId:             "1:719331089999:web:095216ba9d30f54a59d43a",
  };
  const CLOUDINARY_CLOUD_NAME    = "wx2mgbvt";
  const CLOUDINARY_UPLOAD_PRESET = "Don Valencia";
  const FOTO_MAX_BREEDTE = 1280;   // resize photos down to this max width before upload
  const FOTO_KWALITEIT   = 0.8;    // JPEG quality (0-1)

  // One fixed event path — this whole file is built for a single trip/event,
  // not many concurrent groups. Change this string if you ever reuse the app
  // for a different trip (gives it a fresh, empty game state in Firebase).
  const EVENT_ID = "valencia2026";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const CHALLENGES_JULIO = [
    { icoon: "",  "",                 titel: "Uno",  tekst: "Wow, wat een prachtig moment. Neem even adem en sta erbij stil dat jullie zojuist nieuw leven hebben gecreëerd. Na keiharde gay sex is het jullie daadwerkelijk gelukt om een kind op aarde te brengen. En niet zomaar eentje ook: het is een baby van maar liefst 5 kilo. \n\nMaar goed, dit is slechts het prille begin van het verhaal van Don Julio en zijn onvermijdelijke reis naar succes. Er zullen hoogtepunten zijn. Er zullen dieptepunten zijn. Er zullen momenten komen waarop het lot zelf hem probeert te breken. Maar als goede ouders zullen jullie aan zijn zijde staan en hem steunen tijdens iedere triomf, tragedie en totaal onverklaarbare levenskeuze. \n\nDon Julio werd geboren in de Kathedraal van Valencia. De meeste baby's huilen bij hun geboorte, maar Julio niet. Julio was anders. \n\nVanaf moment een begon Don Julio al aura te farmen. Een baby van zijn kaliber moet dan ook een outfit hebben om zijn volle mog potentie tot aarde te brengen. Als goede vaders kleden jullie Don Julio met een anti-goon outfit aan voor zijn eerste familiefoto." },
    { icoon: "",  "",                titel: "Dos",  tekst: "Al op jonge leeftijd begon Don Julio een fascinatie te ontwikkelen voor succesvolle mannen met een gezond gebrek aan bescheidenheid. Muhammad Ali, Brian Brobbey, Kanye West; mannen die niet alleen de beste wilden zijn, maar het liefst ook wilden dat iedereen dat wist. Lil Julio voelde zich daarin gezien. \n\nMaar niemand maakte zoveel indruk op hem als Lewis Hamilton. Niet eens alleen vanwege de Formule 1. Julio was vooral diep onder de indruk van alle prachtige vrouwen die hij kon krijgen door zijn bekendheid. Vooral Kim Kardashian met haar plumptious bundankadonk was voor de kleine Julio een droom om naar te streven. \n\nVanaf dat moment stond zijn toekomst vast. \n\nTerwijl andere kinderen in de speeltuin leerden delen, stond Don Julio iedere middag op het verkeersplein zijn racelijnen te perfectioneren. \n\nEr bestaat nog een foto uit die tijd: de jonge Don Julio, midden op het circuit, volledig overtuigd dat Ferrari hem ieder moment kon bellen." },
    { icoon: "",  "",               titel: "Tres",  tekst: "Don Julio was inmiddels elf en begon langzaam te begrijpen dat zijn Formule 1-carrière voorlopig op een vervelend praktisch probleem stuitte: hij mocht nog geen autorijden. De Spaanse staat bleek niet bereid een uitzondering te maken voor uitzonderlijk talent, dus de kleine mogga moest nog een paar jaar wachten. \n\nGelukkig had Julio nog voetbal. Vooral Brian Brobbey. Waar andere kinderen posters van Messi of Ronaldo boven hun bed hadden hangen, keek Julio liever naar een man die gebouwd was alsof iemand per ongeluk een spits had gemaakt met de instellingen van een chimpansee. \n\nBrobbey werd zijn voorbeeld. \n\nDus werd er getraind. Iedere dag. Schieten, sprinten, beuken en vooral geen enkele seconde besteden aan goonen wat hem van zijn doelen kan afleiden. \n\nOp zijn elfde vond Julio dat hij klaar was voor het echte werk. Hij besloot dat zijn eerste stap tot succes, de lokale legende Gaia vernietigen was. Dus ging hij naar de plek waar de grootste kans was hem te vinden te gaan. Later kwam een foto in de krant van de elf jarige Julio voor de extreme aura die gefarmed werd in zijn poging tot Gaia te vernederen." },
    { icoon: "",  "",                 titel: "Cuatro",  tekst: "Door zijn foto in de krant kreeg hij een kans om het team te joinen en na een indrukwekkende show van skill mocht hij het team in. Een enkel jaar later raakte Julio zo gefrustreerd doordat zijn teamgenoot niet zijn visie van het veld had, dat het eindigde in een vechtpartij waar Julio zijn teamgenoot Minnie Goeny bijna dood had geslagen. Hierdoor werd hij op de bench gezet met vrijwel geen mogelijkheid om nog voor het startende team te spelen. Jaar na jaar meldde hij zich weer bij Valencia en jaar na jaar werd hij afgewezen. Tegen de tijd dat hij zestien was had Julio het al bijna helemaal opgegeven. \n\nEchter na een avondtraining werd hij buiten het stadion aangesproken door een man die hij daar al vaker had zien rondlopen. \n\n“Hey, Don Julio,” zei hij terwijl hij opvallend lang zijn lippen bevochtigde. “Ik ben Don Ner. Maar jij mag me Mo noemen.” \n\nDe man vertelde hem dat hij “connecties hoog in de club” had en nodigde hem uit voor een diner om zijn toekomst bij Valencia te bespreken. Toen ze aankwamen bleek die lunch plaats te vinden in een shishalounge met uitzicht op de Sanatorio de Santa Rosa. \n\nJulio zei ik ben maar 16 ik mag niet naar binnen, maar Mo vertelde hem dat hij eigenaar van de zaak was en dat hij zich nergens druk om hoefde te maken. \n\nJulio dacht terug aan alle waarschuwingen van zijn vaders om nooit moslims te vertrouwen, maar ergens diep vanbinnen hoorde hij ook nog steeds de Champions League naar hem roepen. \n\nDus ging hij naar binnen. \n\nVan de uren daarna weet Don Julio vrijwel niets meer. Het enige tastbare bewijs van die avond is een foto waarop hij compleet van de wereld aan een waterpijp hangt, met op de achtergrond het gebouw waar hij vlak daarvoor nog redelijk helder naar stond te kijken." },
    { icoon: "",  "",                 titel: "Cinco",  tekst: "De avond bij Don Ner had meer schade aangericht dan alleen een kater en een diepgewortelde afkeer van water en pijpen. In de weken erna begon Don Julio voor het eerst in zijn leven serieus na te denken over wie hij eigenlijk was. Acht jaar lang had hij geprobeerd profvoetballer te worden, zich volgestopt met Brobbey-compilaties en zijn hele persoonlijkheid gebouwd rondom mannen die eruitzagen alsof ze hun ontbijt uit de boom halen. \n\nMisschien was hij daar gewoon klaar mee. \n\nOp zijn achttiende verjaardag kwam Julio uiteindelijk met een mededeling waar zijn vier vaders totaal niet op voorbereid waren: hij voelde zich misschien toch een stuk meer vrouw dan man. \n\nVoor vier homoseksuele vaders zou je verwachten dat dit goed over ging maar als er een ding is wat homo’s haten dan is het wel een vagina. \n\nDon Juliona wilde aan haar vaders bewijzen hoe serieus zij dit nam en zocht daarvoor het grootste, meest overdreven symbool van een man dat zij kon vinden: een gigantische vent, languit op de grond, klaar om symbolisch overwonnen te worden. \n\nDie middag nam zij een foto waarin alles schreeuwde ‘ik ben trans!’ en stuurde ze die foto naar haar vader" },
    { icoon: "",  "", titel: "Seis",  tekst: "Na de foto ging Don Juliona terug naar huis om haar vaders onder ogen te komen. Het gesprek ontaardde in een ruzie van bijbelse proporties. Er werd geschreeuwd, er werd gewezen, er werd gehuild, en op een bepaald moment trok Don Juliona zelfs een mes. \n\nDe jaren daarna verdwenen in een waas van verslaving, straathoeken en mannen met een bedroevend gebrek aan zelfrespect. Don Juliona leefde op straat, verkocht haar lichaam om aan drugs te komen en raakte langzaam de weg kwijt. \n\nOp een middag zat ze op een terras met acht lege bierglazen voor zich op tafel. Ze was er slecht aan toe, maar nog net helder genoeg om om zich heen te kijken. Voor haar lag een rozentuin, strak en netjes in formatie. Iets daaraan bracht haar ineens terug naar vroeger. Naar haar vaders. Naar de kinderwegen. Naar de tijd waarin ze nog gewoon rondreed en deed alsof ze Lewis Hamilton was. \n\nVlak voordat ze haar bewustzijn begon te verliezen, maakte Don Juliona nog snel een selfie. Haar gezicht vooraan, alle acht lege bierglazen duidelijk in beeld, en achter haar de rozentuin alsof haar leven niet al lang volledig uit koers was geraakt" },
    { icoon: "",  "",                     titel: "Siete",  tekst: "Het terrasverhaal liep slechter af dan gehoopt. Don Juliona werd na een overdosis opgenomen in het ziekenhuis en van daaruit doorgestuurd naar een speciale rehabkliniek. Uit onderzoek bleek al snel dat er niet alleen alcohol en andere rommel in haar systeem zat, maar ook een uitzonderlijk vergevorderde verspreiding van het wokevirus. De artsen keken ernaar, fronsten een tijdje en kwamen toen tot een pijnlijke conclusie: de westerse geneeskunde ging dit niet meer oplossen. \n\nDus het was tijd om de Chinezen te bellen. \n\nZo kwam Don Juliona terecht bij Ju Ying, een man die volgens de verhalen met traditionele geneesmiddelen en obscure kruiden meer voor elkaar kreeg dan een heel Westers medisch team bij elkaar. En hoe vreemd het ook allemaal begon, langzaam werkte het. Na een half jaar in rehab, heel veel behandeling en nog een transitie-operatie kwam Don Julio stukje bij beetje weer terug. Ook het contact met zijn vaders werd in die periode weer goed. Voor het eerst in lange tijd leek het alsof niemand elkaar meer met een mes, een schreeuw of een overdosis tegemoet hoefde te treden. \n\nBij het afscheid van de kliniek werd nog een laatste groepsfoto gemaakt. Don Julio stond erop met Ju Ying, duidelijk zichtbaar als de man die hem er weer bovenop had geholpen. Daarnaast stonden zijn vaders, die hem met een bijna ontroerende hoeveelheid dankbaarheid aankeken, simpelweg blij dat ze hun zoon weer terug hadden." },
    { icoon: "",  "",                 titel: "Ocho",  tekst: "Na een half jaar rehab, een herstelde familieband en de therapeutische tussenkomst van Ju Ying besloot Don Julio dat het tijd was voor zijn volgende missie: zijn fysieke piek bereiken en zijn mannelijkheid met rente terugverdienen. \n\nVanaf dat moment draaide alles om trainen. Eten, tillen, spiegels, eiwitten en een ego dat met de week zichtbaarder groeide. Don Julio was ervan overtuigd dat zijn lichaam bezig was aan iets historisch. Het enige probleem was dat hij nog steeds geen baan had en dus ook geen geld voor een abonnement. Daarom moest hij sportscholen binnen sneaken. \n\nDat ging opvallend lang goed. Totdat hij steeds opnieuw dezelfde fout begon te maken. Zodra hij in de gym een man zag die nog groter was dan hijzelf, wilde hij daar direct een foto mee. Dat werd zelden gewaardeerd. Meestal eindigde het ermee dat hij eruit werd gezet. \n\nMaar op zijn absolute piek lukte het hem toch nog één keer. \n\nOp een dag sneakte Don Julio opnieuw een sportschool binnen, vond de grootste man die hij kon vinden, trok zijn shirt uit en liet een foto maken alsof de hele ruimte van hem was. Objectief gezien was hij duidelijk kleiner. Alleen was zijn ego inmiddels zo ver ontwikkeld dat hij dat zelf totaal niet meer kon waarnemen. \n\nDie foto werd later zijn favoriete bewijsstuk. Don Julio, half opgepompt van de training en volledig opgepompt van zichzelf, shirt uit, naast een unit van guy, met de rotsvaste overtuiging dat hij hier duidelijk de indrukwekkendste persoon in beeld was." },
    { icoon: "",  "",                 titel: "Nueve",  tekst: "Na jaren zonder duidelijke richting besloot Don Julio op een middag ergens een drankje te doen. Aan de bar bestelde hij een Nikka from the barrel en een cerro negro en mixte de twee zijn favoriet. \n\nNog voordat hij zijn eerste slok had genomen, draaide een man naast hem zich om. \n\n“Uitstekende keuze. De Nikka Negro is ook mijn favoriet.” \n\nDe man vertelde dat het drankje hem altijd deed denken aan het oude Valencia, uit de tijd dat deze bar nog een apotheek was. Don Julio wist niet precies waarom een alcoholisch drankje hem aan medicijnen deed denken, maar hij besloot er verder geen vragen over te stellen. \n\nDe twee raakten aan de praat. De man stelde zichzelf voor als Harvey en vertelde dat hij net terugkwam van een recruitmentdag voor zijn kantoor. Het was volgens hem dramatisch verlopen. De nieuwe generatie Gen Z’ers was volledig de weg kwijt en hij had nog niemand gevonden met genoeg geheugen, overtuigingskracht en charisma om fatsoenlijk voor een rechter te kunnen staan. \n\nDat klonk Don Julio ineens verdacht bekend in de oren. \n\nEen van zijn vaders had hem als kind namelijk gedwongen complete wetboeken door te lezen. Niet omdat daar een goede reden voor was, maar omdat zijn vader vond dat een kind “ooit ergens verstand van moest hebben”. Tot ieders verbazing bleek Don Julio vrijwel alles nog te onthouden. \n\nHij bood zichzelf direct aan als kandidaat. \n\nHarvey geloofde er weinig van en begon hem ter plekke te testen. Wetsartikelen, moeilijke situaties, argumenten en een paar vragen waarvan Don Julio vrij zeker wist dat Harvey zelf het antwoord niet kende. Julio doorstond alles zonder een fout en vulde de rest aan met zoveel zelfvertrouwen dat Harvey op een gegeven moment eigenlijk geen keuze meer had. \n\nDon Julio was binnen. \n\nVoordat ze vertrokken vroeg Harvey de barman nog snel een foto van hen te maken. Don Julio en Harvey, die bij nader inzien verrassend veel op een van zijn vaders leek, samen aan de bar met hun Nikka Negros in de hand en de oude apotheek om hen heen. \n\nEen paar jaar later hing die foto spontaan aan de muur van de bar, als het legendarische begin van de carrière van Don Julio." },
    { icoon: "",  "",           titel: "Diez", tekst: "Een aantal jaren later, op 32-jarige leeftijd, had Don Julio het samen met Harvey volledig gemaakt. De twee hadden de juridische wereld compleet omvergegooid en Don Julio had inmiddels meer rechtszaken gewonnen dan hij zelf nog kon tellen. Geld, status, aanzien; alles waar hij vroeger alleen maar van kon dromen had hij nu in overvloed. \n\nToch miste er nog een ding. \n\nLiefde. \n\nTot hij op een middag op zijn jacht in de haven van Valencia een prachtige vrouw tegenkwam. Haar naam was Don Julia. Vanaf het eerste gesprek klikte het meteen en voor Don Julio het wist hadden de twee de rest van de dag samen doorgebracht. \n\nAan het einde van de middag wilde Julio het moment natuurlijk vastleggen. Hij riep een van de plebs die op de haven rondliepen en gaf hem zijn telefoon om een foto te maken van het nieuwe koppel op zijn jacht. \n\nDon Julia was alleen nog een beetje cameraschuw en dook precies op het moment van de foto buiten beeld. \n\nHet resultaat was daardoor een foto van alleen Don Julio op zijn prachtige jacht, met de haven achter hem en een tevredenheid op zijn gezicht die hij in al die jaren nog nooit had gehad. Na alles wat er was gebeurd had hij eindelijk het gevoel dat zijn leven compleet was." },
    { icoon: "",  "",             titel: "El Finale", tekst: "Het is hedendaagse dag en het is tijd voor de trouwerij van jullie gelieve zoon Don Julio. \n\nNa jaren aan blijdschap, romance en seks is het tijd om Don Julio en Don Julia officieel te maken. Als zijn gelieve vaders is het aan jullie om je zoon naar de mooiste dag van zijn leven te leiden.  \n\nDon Julio gaat natuurlijk trouwen op het prachtige strand van Valencia en bij het monument wat ze doet denken aan de plek waar ze elkaar als eerst hebben ontmoet." },

  const CHALLENGES_JULIA = [
    { icoon: "",  "",                 titel: "Uno",  tekst: "In een land hier niet al te ver vandaan, in een koninkrijk dat ooit Valencia werd genoemd, sliep al vele, vele jaren een prinses onder een mysterieuze betovering. \n\nNiemand wist precies hoelang zij daar al lag. Sommigen spraken over honderd jaar, anderen over duizend, en sommigen beweren dat ze tot kort gewoon in een magazijn stond. Eén ding stond echter vast: op deze prinses rustte een eeuwenoude vloek. \n\nSindsdien wachtte zij al die tijd al rustend op de Plaza de la Virgen, aan de voet van haar oude koninkrijk, op degenen die haar eindelijk zouden bevrijden. \n\nVolgens de legende kon de eeuwenlange slaap slechts op één manier worden doorbroken. Hare Hoogheid kon alleen gewekt worden zoals alleen een échte prinses na een eeuwenlange slaap behoort te ontwaken. \n\nZodra Hare Hoogheid ontwaakt, mag eindelijk de kurk van haar fles." },
    { icoon: "",  "",                titel: "Dos",  tekst: "De prinses opende langzaam haar ogen en keek de vier mannen aan die haar zojuist uit haar eeuwenlange slaap hadden ontwaakt. \n\n“Dios Mío… wat zijn jullie clapped. Dit kunnen onmogelijk mijn prinsen zijn.” \n\nZe probeerde overeind te komen, maar moest zich onmiddellijk weer even herpakken. Na honderd jaar slaap voelde Hare Hoogheid zich namelijk opmerkelijk beschonken. Haar hoofd tolde, haar evenwicht liet te wensen over, en om de een of andere reden zat ze ook nog eens tot de nok toe vol met drank. \n\nZe bekeek hen nog één keer en zuchtte diep. \n\n“Maar goed. Een prinses kan niet zonder haar personeel. Vanaf nu zijn jullie mijn vier onderdanige lakeien!” \n\nNa eeuwen slapen vond Hare Hoogheid het bovendien schandalig dat niemand fatsoenlijke kleding voor haar had klaargelegd. Ze sliep al die tijd immers poedeltje naakt – ookal vond ze dat ergens ook best geil. Een prinses hoort immers niet ongekleed door haar eigen koninkrijk te trekken. \n\nEn dus stuurde Hare Hoogheid haar nieuwe lakeien de oude straten van El Carmen in. \n\nPas wanneer Hare Hoogheid gekleed was als ware royalty, kon zij haar tocht door het koninkrijk voortzetten; omringd door vier nederige lakeien die inmiddels precies wisten wat hun plaats was: volledig onder de duim van deze veeleisende prinfles!" },
    { icoon: "",  "",               titel: "Tres",  tekst: "Terwijl de prinfles met haar vier lakeien door haar oude koninkrijk trok, verscheen er plotseling een mysterieuze vrouw op haar pad. \n\nZe was krom, vreemd gekleed en was volgens de prinfles misschien wel de áller lelijkste vrouw die in heel Valencia te vinden zou zijn. \n\n“Ah. Een heks.” Zei ze. \n\nDe heks keek haar diep geschokt aan \n\n“Prinses, gij zijt niet alleen dronken. Uw trots benevelt uw blik en laat u slechts zien wat gij wílt zien.” \n\nZe hief haar handen en sprak ineens een wilde betovering uit! \n\n“Zolang gij vasthoudt aan wat ooit was, zal deze roes u gevangenhouden. Pas wanneer gij uzelf en uw lot aanvaardt, zal de mist verdwijnen.” \n\nDe heks keek haar nog eenmaal ernstig aan. \n\n“En pas dan zult gij de woorden begrijpen die nog op u wachten.” \n\nDaarna wendde ze zich tot haar lakeien en begon ze langzaam in rook op te losse \n\n“Slechts één boodschap zal met u meereizen, maar die u tweemaal de waarheid zal vertellen.” \n\nMet een laatste grijns verdween de heks volledig. \n\nOp datzelfde moment verschenen er plotseling een verzegelde envelop in de tas van Mathijs." },
    { icoon: "",  "",                 titel: "Cuatro",  tekst: "Na het openen van de brief, bleven de woorden van de heks nog ergens vaag in het achterhoofd van de prinfles rondspoken. Maar eerlijk gezegd was Hare Hoogheid nog veel te dronken om zich daar druk om te make \n\n“Faka met haar dan. Ik weet zelf wel wat goed voor me is.” Mormelde ze \n\n Dit was háár koninkrijk. Haar volk had eeuwen op haar terugkeer gewacht en het werd tijd voor de mensen om haar met open armen te ontvangen. \n\nDaarom beval zij haar lakeien haar naar het grote plein te brengen waar het stadsbestuur over Valencia waakt en het volk zich verzamelt. Daar zou haar glorieuze terugkeer worden aangekondigd. \n\nGeen simpele entree, natuurlijk. Hare Hoogheid verlangde naar spektakel, gejuich en zóveel aandacht dat niemand op het plein nog om haar heen kon. Vandaag zou Valencia weten dat haar enige echte prinfles is teruggekeerd!" },
    { icoon: "",  "",                 titel: "Cinco",  tekst: "De grootse terugkeer van Hare Hoogheid verliep niet helemaal volgens plan. Niemand juichte. Niemand knielde. Sterker nog: vrijwel niemand leek ook maar enig idee te hebben wie ze echt was. \n\nNa haar nogal teleurstellende ontvangst droop de prinfles langzaam verder naar het Zuiden van haar koninkrijk en, voor de eerste keer in haar leven, begon ze aan zichzelf te twijfelen. Zou de heks dan ergens toch gelijk hebben? \n\nVolgens oude verhalen lag in het Zuiden een plaats waar het volk zijn voedsel bijeenbracht. Geen paleis, geen tempel, maar een bonte hal vol handelaren, geuren, kleuren en vreemde waren uit alle hoeken van het rijk. \n\nMaar tussen het geschreeuw van handelaren en de bergen met voedsel zag Hare Hoogheid plotseling iets wat haar aandacht trok. Ze bleef verstijfd staan… \n\n“Wa- wat in de cancerpoentje is dát?” Schreeuwde ze uit. \n\nHare Hoogheid eiste onmiddellijk haar lakeien voor een verklaring voor het vreemdste, meest onbegrijpelijke en verontrustende dat deze plek volgens haar te bieden had." },
    { icoon: "",  "", titel: "Seis",  tekst: "Na gerust te zijn gesteld door haar vier debiele lakeien hoorden ze een harde doffe klap uit het Oosten komen. De prinfles en haar bediendes besloten maar eens een kijkje te gaan nemen en stuitten op een plek dat ooit overspoeld werd met water. \n\nHet water was echter helemaal verdwenen. In de oude rivierbedding groeiden nu bomen en gras, en midden tussen al dat groen lag een oude bekende van de prinfles. Blijkbaar was hij met een enorme klap ten val gekomen. \n\nHare Hoogheid keek haar oude vriend aandachtig aan. Het was duidelijk dat hij op sterven lag. \n\n“Ach… jij hebt duidelijk ook te veel op.” Zei ze vol zelfvertrouwen. \n\nHaar lakeien waren daar iets minder zeker van. De oude boezemvriend zag bleek, bewoog nauwelijks en leek zijn laatste adem uit te blazen. \n\nDe prinfles weigerde hem zomaar achter te laten. Als ervaringsdeskundige op het gebied van demonische katers wist zij precies wat nodig was om haar oude grote vriend weer op de been te krijgen. " },
    { icoon: "",  "",                     titel: "Siete",  tekst: "Met zijn laatste, teleurgestelde blik wees de reus langzaam met zijn vinger naar het Zuid-Oosten. Het leek alsof hij Hare Hoogheid iets duidelijk wilde te maken. Iets wat maar niet tot haar door wilde dringen… \n\nDe prinfles volgde zijn aanwijzing en bereikte uiteindelijk de wateren waar volgens oude verhalen al eeuwenlang een gigantisch zeebeest huisde. \n\nHare Hoogheid aarzelde geen moment. Samen met haar vier lakeien trok zij gelijk ten strijde. \n\nIn haar beleving duurde het gevecht dagen. Golven sloegen om hen heen, het monster vocht terug met alles wat het had en meerdere malen leek de strijd verloren. \n\nUiteindelijk stond de prinfles als overwinnaar tussen haar trouwe lakeien, maar niet zonder slag of stoot. \n\nVoor haar staken alleen nog de enorme witte resten van het beest uit het water. De kop was nog duidelijk zichtbaar en daarachter rezen de gigantische ribben en graten van zijn overgebleven geraamte omhoog. \n\n“Eindelijk,” sprak Hare Hoogheid trots. “Het monster dat mijn koninkrijk eeuwenlang heeft geteisterd is eindelijk verslagen!” \n\nHaar lakeien juichten trouw met haar mee. \n\nGeen van hen durfde te vertellen dat het beest waarschijnlijk al vele jaren dood was voordat de prinfles überhaupt wakker werd." },

  // Always look up the active team's own story through this — never reach
  // for CHALLENGES_JULIO / CHALLENGES_JULIA directly outside this function,
  // so the two stories can never accidentally cross.
  function huidigeUitdagingen() {
    return huidigTeam === 'julia' ? CHALLENGES_JULIA : CHALLENGES_JULIO;
  }

  // ══════════════════════════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════════════════════════
  let huidigTeam = null;      // 'julio' | 'julia'
  let huidigeIndex = 0;       // index of the currently unlocked/active challenge
  let voltooid = {};          // { index: { fotoUrl, ts } } — completed challenges
  let authKlaar = false;
  let gekozenBestand = null;

  auth.signInAnonymously().catch(function(err) { console.error('Auth failed:', err); });
  auth.onAuthStateChanged(function(user) {
    authKlaar = !!user;
    const opgeslagenTeam = localStorage.getItem('donjulio_team');
    const opgeslagenPw   = localStorage.getItem('donjulio_pw');
    if (authKlaar && opgeslagenTeam && opgeslagenPw) {
      herstelSessie(opgeslagenTeam, opgeslagenPw);
    }
  });

  function teamRef(team) { return db.ref('spellen/' + EVENT_ID + '/teams/' + team); }

  // ── Team pick + password gate ──
  let _wachtwoordVoorTeam = null;

  function kiesTeam(team) {
    _wachtwoordVoorTeam = team;
    teamRef(team).child('wachtwoord').get().then(function(snap) {
      const bestaandWachtwoord = snap.val();
      const titel = document.getElementById('wachtwoord-titel');
      const uitleg = document.getElementById('wachtwoord-uitleg');
      document.getElementById('wachtwoord-input').value = '';
      document.getElementById('wachtwoord-fout').style.display = 'none';
      if (bestaandWachtwoord) {
        titel.textContent = 'Enter the team password';
        uitleg.textContent = 'Someone on your team already started — ask them for the password.';
      } else {
        titel.textContent = 'Set a team password';
        uitleg.textContent = "You're first! Pick a password and share it with your teammates.";
      }
      document.getElementById('overlay-wachtwoord').classList.add('actief');
    });
  }

  function sluitWachtwoordPopup() {
    document.getElementById('overlay-wachtwoord').classList.remove('actief');
    _wachtwoordVoorTeam = null;
  }

  async function bevestigWachtwoord() {
    const ingevoerd = document.getElementById('wachtwoord-input').value.trim();
    if (!ingevoerd) return;
    const team = _wachtwoordVoorTeam;
    const snap = await teamRef(team).child('wachtwoord').get();
    const bestaand = snap.val();
    if (bestaand) {
      if (ingevoerd !== bestaand) {
        document.getElementById('wachtwoord-fout').style.display = 'block';
        return;
      }
    } else {
      await teamRef(team).child('wachtwoord').set(ingevoerd);
    }
    localStorage.setItem('donjulio_team', team);
    localStorage.setItem('donjulio_pw', ingevoerd);
    document.getElementById('overlay-wachtwoord').classList.remove('actief');
    startTeam(team);
  }

  function herstelSessie(team, wachtwoord) {
    teamRef(team).child('wachtwoord').get().then(function(snap) {
      if (snap.val() === wachtwoord) startTeam(team);
    });
  }

  function openGordijn() {
    const g = document.getElementById('gordijn');
    g.classList.add('open');
    // Let the slide-apart transition finish, then take it fully out of the
    // way so it can't intercept taps on the main menu underneath.
    setTimeout(function() { g.style.display = 'none'; }, 950);
  }

  // Testing helper — wipes both teams' progress and passwords for this
  // EVENT_ID entirely, and clears the saved local session so you don't
  // keep auto-rejoining a half-finished test run. Remove or hide this
  // button before the real event if you don't want guests able to see it.
  async function resetSpel() {
    const bevestigd = confirm('Reset ALL progress for both teams? This cannot be undone.');
    if (!bevestigd) return;
    await db.ref('spellen/' + EVENT_ID).remove();
    localStorage.removeItem('donjulio_team');
    localStorage.removeItem('donjulio_pw');
    alert('Game reset — both teams will start fresh.');
  }

  function toonTeamkeuze() {
    document.getElementById('screen-hoofdmenu').classList.remove('actief');
    document.getElementById('screen-team-select').classList.add('actief');
  }

  function startTeam(team) {
    huidigTeam = team;
    // Covers both the normal path (from team-select) and auto-rejoin on
    // page load (which can jump here straight from the main menu).
    document.getElementById('screen-hoofdmenu').classList.remove('actief');
    document.getElementById('screen-team-select').classList.remove('actief');
    document.getElementById('screen-board').classList.add('actief');
    const header = document.getElementById('board-header');
    header.className = 'board-header ' + team;
    document.getElementById('board-header-titel').textContent = team === 'julio' ? 'Don Julio' : 'Don Julia';
    bindListener();
  }

  // Exit takes you all the way back to the main menu, not just team-select —
  // a clean reset for whoever picks up the phone next.
  function verlaatNaarStart() {
    if (teamListenerRef) { teamListenerRef.off(); teamListenerRef = null; }
    huidigTeam = null;
    document.getElementById('screen-board').classList.remove('actief');
    document.getElementById('screen-team-select').classList.remove('actief');
    document.getElementById('screen-hoofdmenu').classList.add('actief');
  }

  // ── Live sync of team progress ──
  let teamListenerRef = null;
  function bindListener() {
    teamListenerRef = teamRef(huidigTeam);
    teamListenerRef.on('value', function(snap) {
      const data = snap.val() || {};
      huidigeIndex = data.huidigeIndex || 0;
      voltooid = data.voltooid || {};
      renderBord();
      if (huidigeIndex >= huidigeUitdagingen().length) toonEinde();
    });
  }

  // ── Board rendering: Mario-overworld style snake path ──
  function knoopPositie(i, totaal) {
    const rijen = Math.ceil(totaal / 3);
    const rij = Math.floor(i / 3);
    const posInRij = i % 3;
    const rijEvenRichting = rij % 2 === 0; // even rows: left-to-right, odd: right-to-left
    const col = rijEvenRichting ? posInRij : (2 - posInRij);
    const x = 20 + col * 30;                              // 20 / 50 / 80
    const y = rijen <= 1 ? 50 : 10 + (rij / (rijen - 1)) * 80; // spread 10–90
    return { x: x, y: y };
  }

  function renderBord() {
    const container = document.getElementById('pad-container');
    const svg = document.getElementById('pad-svg');
    document.getElementById('board-voortgang').textContent = Math.min(huidigeIndex, huidigeUitdagingen().length) + ' / ' + huidigeUitdagingen().length;

    // Remove old node elements (keep the svg)
    container.querySelectorAll('.node').forEach(function(el) { el.remove(); });

    const punten = huidigeUitdagingen().map(function(c, i) { return knoopPositie(i, huidigeUitdagingen().length); });

    // Draw the path in real pixel space (not a 0-100 viewBox stretched to fit)
    // so the stroke stays a true circle/round cap instead of getting warped
    // by the container's aspect ratio. Node <div>s still use % positioning,
    // which is unaffected by aspect ratio, so the two line up correctly.
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    const lijnPunten = punten.map(function(p) { return (p.x / 100 * w) + ',' + (p.y / 100 * h); }).join(' ');
    // Retro-path look: a dark "border" stroke underneath, a lighter "surface"
    // stroke on top — same trick as the dirt/stone path tiles in the
    // reference image (dark edge, lighter worn center), just via two strokes
    // instead of a texture image.
    svg.innerHTML =
      '<polyline points="' + lijnPunten + '" fill="none" stroke="#a9895a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />' +
      '<polyline points="' + lijnPunten + '" fill="none" stroke="#e4c98f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />';

    punten.forEach(function(p, i) {
      const el = document.createElement('div');
      let status = 'locked';
      if (voltooid[i]) status = 'voltooid';
      else if (i === huidigeIndex) status = 'actief';
      const isFinale = i === huidigeUitdagingen().length - 1;
      el.className = 'node ' + status + (isFinale ? ' finale' : '');
      el.style.left = p.x + '%';
      el.style.top  = p.y + '%';
      // Deliberately no title/label here — nothing about a challenge is
      // revealed until you actually tap into it. The finale badge just
      // marks "this is the last one", not what it actually is.
      el.textContent = status === 'voltooid' ? '✓' : String(i + 1);
      if (isFinale) {
        const badge = document.createElement('span');
        badge.className = 'finale-badge';
        badge.textContent = 'FINAL';
        el.appendChild(badge);
      }
      if (status === 'actief') el.addEventListener('click', function() { openUitdaging(i); });
      if (status === 'voltooid') el.addEventListener('click', function() { bekijkVoltooid(i); });
      container.appendChild(el);
    });

    updateSpelerFiguur(container, punten);
  }

  // Little champagne-bottle marker that hops to whichever node is currently
  // active — parked there when idle, and slowly hops over to the new one the
  // moment huidigeIndex advances. Also grows from a "baby" bottle toward
  // full size as more of the story gets completed.
  let vorigeSpelerIndex = null;
  function updateSpelerFiguur(container, punten) {
    let fig = document.getElementById('speler-figuur');
    if (!fig) {
      fig = document.createElement('div');
      fig.id = 'speler-figuur';
      fig.className = 'speler-figuur';
      // Appended once and never moved again — re-appending on every render
      // (to "stay on top") was the bug that made it snap instead of glide:
      // reinserting an element into the DOM resets its transition baseline.
      // z-index already puts it above the nodes, so this isn't needed anyway.
      container.appendChild(fig);
    }

    const doelIndex = Math.min(huidigeIndex, huidigeUitdagingen().length - 1);
    const doel = punten[doelIndex];

    const voltooidAantal = Object.keys(voltooid).length;
    const groei = 0.55 + Math.min(1, voltooidAantal / huidigeUitdagingen().length) * 0.65; // 0.55 → 1.2
    fig.style.setProperty('--figuur-schaal', groei.toFixed(2));

    if (doelIndex !== vorigeSpelerIndex) {
      // Restart the hop cleanly even if triggered again quickly.
      fig.classList.remove('hopt');
      void fig.offsetWidth; // force reflow so the class removal actually "sticks" before re-adding
      fig.classList.add('hopt');
      vorigeSpelerIndex = doelIndex;
    }
    fig.style.left = doel.x + '%';
    fig.style.top  = doel.y + '%';
  }

  // Re-draw on resize/orientation change so the path stays pixel-accurate
  // (only matters while the board is actually visible).
  window.addEventListener('resize', function() {
    if (huidigTeam) renderBord();
  });

  // ── Challenge modal ──
  let huidigeUitdagingIndex = null;

  function openUitdaging(i) {
    huidigeUitdagingIndex = i;
    const c = huidigeUitdagingen()[i];
    document.getElementById('uitdaging-icoon').textContent = c.icoon;
    document.getElementById('uitdaging-hint').textContent = 'Near: ' + c.hint;
    document.getElementById('uitdaging-titel').textContent = c.titel;
    document.getElementById('uitdaging-tekst').textContent = c.tekst;
    document.getElementById('upload-preview').style.display = 'none';
    document.getElementById('upload-status').style.display = 'none';
    document.getElementById('upload-knop').disabled = false;
    document.getElementById('upload-knop').textContent = '📷 Take / choose photo';
    document.getElementById('modal-uitdaging').classList.add('actief');
  }

  function bekijkVoltooid(i) {
    const c = huidigeUitdagingen()[i];
    const v = voltooid[i];
    huidigeUitdagingIndex = null; // read-only view, no re-upload
    document.getElementById('uitdaging-icoon').textContent = c.icoon;
    document.getElementById('uitdaging-hint').textContent = 'Near: ' + c.hint;
    document.getElementById('uitdaging-titel').textContent = c.titel + ' ✓';
    document.getElementById('uitdaging-tekst').textContent = c.tekst;
    const preview = document.getElementById('upload-preview');
    if (v && v.fotoUrl) { preview.src = v.fotoUrl; preview.style.display = 'block'; }
    document.getElementById('upload-status').style.display = 'none';
    document.getElementById('upload-knop').disabled = true;
    document.getElementById('upload-knop').textContent = 'Already completed';
    document.getElementById('modal-uitdaging').classList.add('actief');
  }

  function sluitUitdaging() {
    document.getElementById('modal-uitdaging').classList.remove('actief');
    huidigeUitdagingIndex = null;
  }

  // Resize + JPEG-compress before upload — keeps uploads fast on mobile data
  // and caps how large a file can reach the Cloudinary API, on top of
  // whatever allowed_formats/max_file_size you've set on the preset itself.
  function comprimeerFoto(bestand) {
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let w = img.width, h = img.height;
          if (w > FOTO_MAX_BREEDTE) { h = Math.round(h * FOTO_MAX_BREEDTE / w); w = FOTO_MAX_BREEDTE; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL('image/jpeg', FOTO_KWALITEIT)); }
          catch (err) { reject(err); }
        };
        img.onerror = function() { reject(new Error('invalid image')); };
        img.src = e.target.result;
      };
      reader.onerror = function() { reject(new Error('failed to read file')); };
      reader.readAsDataURL(bestand);
    });
  }

  async function bestandGekozen(event) {
    const bestand = event.target.files[0];
    event.target.value = '';
    if (!bestand || huidigeUitdagingIndex === null) return;

    const preview = document.getElementById('upload-preview');
    const status  = document.getElementById('upload-status');
    const knop    = document.getElementById('upload-knop');
    preview.src = URL.createObjectURL(bestand);
    preview.style.display = 'block';
    status.style.display = 'block';
    status.textContent = 'Compressing…';
    knop.disabled = true;

    try {
      const gecomprimeerd = await comprimeerFoto(bestand);
      status.textContent = 'Uploading…';
      const fotoUrl = await uploadNaarCloudinary(gecomprimeerd);
      status.textContent = 'Uploaded! Unlocking the next stop…';
      const i = huidigeUitdagingIndex;
      // Only advance if this is still the currently-active square (avoids two
      // teammates both uploading at once and double-advancing the index).
      await teamRef(huidigTeam).transaction(function(data) {
        data = data || {};
        if ((data.huidigeIndex || 0) !== i) return data; // someone beat you to it
        data.voltooid = data.voltooid || {};
        data.voltooid[i] = { fotoUrl: fotoUrl, ts: Date.now() };
        data.huidigeIndex = i + 1;
        return data;
      });
      setTimeout(sluitUitdaging, 700);
    } catch (err) {
      console.error(err);
      status.textContent = 'Upload failed — try again.';
      knop.disabled = false;
    }
  }

  function uploadNaarCloudinary(bestand) {
    return new Promise(function(resolve, reject) {
      const form = new FormData();
      form.append('file', bestand);
      form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', {
        method: 'POST', body: form,
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.secure_url) resolve(data.secure_url);
          else reject(new Error(data.error ? data.error.message : 'Upload failed'));
        })
        .catch(reject);
    });
  }

  // ── End of game ──
  let eindeGetoond = false;
  function toonEinde() {
    if (eindeGetoond) return;
    eindeGetoond = true;
    const galerij = document.getElementById('einde-galerij');
    galerij.innerHTML = '';
    huidigeUitdagingen().forEach(function(c, i) {
      if (voltooid[i] && voltooid[i].fotoUrl) {
        const img = document.createElement('img');
        img.src = voltooid[i].fotoUrl;
        galerij.appendChild(img);
      }
    });
    document.getElementById('modal-einde').classList.add('actief');
  }

  function sluitEinde() {
    document.getElementById('modal-einde').classList.remove('actief');
    eindeGetoond = false;
    verlaatNaarStart();
  }
</script>
</body>
</html>
